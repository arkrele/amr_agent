problem:
  description: >
    一维稳态对流-扩散方程: -u·dT/dx + κ·d²T/dx² = 0，区间 x ∈ [0, 1]。
    边界条件: T(0)=0, T(1)=1。
    解析解: T(x) = (1 - exp(Pe·x)) / (1 - exp(Pe))，其中 Pe = u/κ。
    本算例 Pe=50（高 Peclet 数），在 x≈1 处存在尖锐边界层。
    初始网格为 20 个均匀分布节点。需要在边界层区域加密。
  pde_type: "convection-diffusion-1d"
  geometry: "1d-interval"
  boundary_conditions:
    left: {type: "dirichlet", value: 0.0}
    right: {type: "dirichlet", value: 1.0}

solver:
  type: "agent_generated"
  path: ""                       # Agent 自己编写求解器
  interface: "generic_cli"
  params:
    peclet: 50
    kappa: 0.02
    velocity: 1.0

mesh:
  initial: "./test_mesh"
  format: "text-1d"
  max_cells: 200

budget:
  max_solver_runs: 3
  max_wall_time_minutes: 10

output:
  target_metrics:
    - "max_error"
    - "l2_error"
    - "boundary_layer_resolution"
  convergence_tolerance: 0.05
  output_dir: "./test_output"
