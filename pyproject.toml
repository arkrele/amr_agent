[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mesh_agent*"]

[project]
name = "mesh-agent"
version = "0.1.0"
description = "LLM-driven adaptive mesh refinement agent for numerical simulation"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "click>=8.0",
    "python-dotenv>=1.0",
]

[project.scripts]
mesh-agent = "mesh_agent.cli:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]
